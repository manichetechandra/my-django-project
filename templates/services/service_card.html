<div class="service-card">
    <!-- Header ملون حسب النوع -->
    <div class="service-card-header service-{{ service.service_type }}">
        <i class="fa {{ service.icon }} service-icon"></i>
        <h4 style="margin: 0; color: white; font-size: 22px;">
            {{ service.get_service_type_display }}
        </h4>
    </div>
    
    <!-- الصورة (اختياري) -->
    {% if service.main_image %}
    <div style="height: 200px; overflow: hidden;">
        <img src="{{ service.main_image.url }}" 
             alt="{{ service.title }}" 
             style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    {% endif %}
    
    <!-- المحتوى -->
    <div class="service-card-body">
        <h3>{{ service.title }}</h3>
        <p>{{ service.short_description|truncatewords:30 }}</p>
        
        <div class="service-meta">
            <small style="color: #999;">
                <i class="fa fa-clock-o"></i> آخر تحديث: {{ service.updated_at|date:"d/m/Y" }}
            </small>
            <br><br>
            <a href="{{ service.get_absolute_url }}" class="btn btn-success btn-block">
                <i class="fa fa-arrow-left"></i> التفاصيل الكاملة
            </a>
        </div>
    </div>
</div>
