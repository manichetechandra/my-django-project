{% load static %}

{% if notifications %}
<div id="notification-container" style="position: relative; z-index: 9999;">
    {% for notification in notifications %}
    <div class="alert {{ notification.get_bootstrap_class }} notification-alert" 
         role="alert" 
         style="margin: 0; border-radius: 0; border: none; padding: 15px; text-align: center; position: relative;">
        
        <!-- أيقونة -->
        <i class="fa {{ notification.get_icon }}" style="font-size: 18px; margin-left: 10px;"></i>
        
        <!-- العنوان -->
        <strong>{{ notification.title }}:</strong>
        
        <!-- الرسالة -->
        {{ notification.message }}
        
        <!-- الرابط (إذا وُجد) -->
        {% if notification.link %}
        <a href="{{ notification.link }}" 
           style="color: inherit; text-decoration: underline; margin-right: 10px; font-weight: bold;">
            {{ notification.link_text }}
            <i class="fa fa-arrow-left"></i>
        </a>
        {% endif %}
        
        <!-- زر الإغلاق -->
        {% if notification.is_dismissible %}
        <button type="button" 
                class="close" 
                data-dismiss="alert" 
                aria-label="إغلاق"
                style="position: absolute; left: 15px; top: 12px; font-size: 24px; opacity: 0.8;">
            <span aria-hidden="true">&times;</span>
        </button>
        {% endif %}
    </div>
    {% endfor %}
</div>

<style>
    .notification-alert {
        animation: slideDown 0.5s ease-out;
    }
    
    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .notification-alert .close:hover {
        opacity: 1;
    }
</style>
{% endif %}
